<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="/css/formStyles.css" type="text/css" />    
</head>
<body>

  <div class="container">  
    
    <h2>Iniciar Sesión</h2>
    
    <form id="loginForm" novalidate>
      
      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" placeholder="Ej. nombre@correo.com" name="correo" required>
      <div id="error-correo" class="mensaje"></div>

      <label for="contrasena">Contraseña:</label>
      <input type="password" id="contrasena" placeholder="Tu contraseña" name="contrasena" required minlength="6">
      <div id="error-contrasena" class="mensaje"></div>

      <div class="btnContainer">
         <button type="submit" class="submit">Iniciar sesión</button>
      </div>
      
      <div class="links">
        <a href="/users/recuperar">¿Olvidaste tu contraseña?</a>
        <a href="/registro">Crear cuenta</a>
      </div>

    </form>
    
  </div>

  <script src="/js/validateFormIS.js"></script>

</body>
</html>
